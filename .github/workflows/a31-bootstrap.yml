name: a31-bootstrap
on:
  workflow_dispatch:
    inputs:
      kernel_run:
        description: Successful xnu run to download (empty keeps historical V11)
        default: ''
      post_rebase:
        description: Require the post-rebase checkpoint in the selected new kernel
        type: boolean
        default: false
      pre_mmu_trap:
        description: Stop the exact V11 kernel at the audited instruction before MMU enable
        type: boolean
        default: false
      post_mmu_trap:
        description: Stop the exact V11 kernel immediately after MMU enable and ISB
        type: boolean
        default: false
      c_entry_trap:
        description: Stop the exact V11 kernel at high-KVA arm_init entry before its prologue
        type: boolean
        default: false
      c_prologue_trap:
        description: Stop the exact V11 kernel after arm_init stack prologue and before diagnostic call
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang lld qemu-system-arm
      - name: Fetch and verify selected kernel
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_RUN: ${{ inputs.kernel_run || '39952374717' }}
          POST_REBASE: ${{ inputs.post_rebase && 'true' || 'false' }}
        run: |
          gh run view "$KERNEL_RUN" --repo "$GITHUB_REPOSITORY" --json status,conclusion,headSha > research-run.json
          gh run download "$KERNEL_RUN" --repo "$GITHUB_REPOSITORY" --name xnu-kernel --dir research/v11-kernel
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p = Path('research/v11-kernel')
          report = json.loads((p / 'a31-entry-check.json').read_text())
          run = json.loads(Path('research-run.json').read_text())
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert report['source'] == run['headSha']
          digest = hashlib.sha256((p / 'kernel.development.a31').read_bytes()).hexdigest()
          assert digest == report['sha256']
          if os.environ['POST_REBASE'] == 'true':
              assert report['source'] == os.environ['GITHUB_SHA']
              assert report['kind'] == 'A31 XNU post-rebase checkpoint only'
              assert report['reset_code']['machine_code_verified'] is True
          else:
              assert digest == '3486ac517fce205e62c5d5b3e95de10152850543fb96c6c6a1db9b63618c0c50'
          PY
      - name: Observe actual linked XNU bootstrap
        run: python3 tools/a31_bootstrap_qemu.py --kernel research/v11-kernel/kernel.development.a31 --out research/bootstrap-observation ${{ inputs.pre_mmu_trap && '--pre-mmu-trap' || '' }} ${{ inputs.post_mmu_trap && '--post-mmu-trap' || '' }} ${{ inputs.c_entry_trap && '--c-entry-trap' || '' }} ${{ inputs.c_prologue_trap && '--c-prologue-trap' || '' }} ${{ inputs.post_rebase && '--post-rebase' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bootstrap-observation
          path: |
            research/bootstrap-observation/monitor.log
            research/bootstrap-observation/serial.log
            research/bootstrap-observation/pstore.bin
            research/bootstrap-observation/pstore.txt
            research/bootstrap-observation/report.json
          if-no-files-found: warn
