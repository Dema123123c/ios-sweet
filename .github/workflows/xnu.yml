name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu target (A31 is initial headless bring-up, no phone drivers)
        type: choice
        options:
          - SWEET
          - A31
        default: A31
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [a31-bringup]
    paths:
      - "xnu/patches/**"
      - "shim/a31/xnu_entry_io*"
      - "tools/test_a31_xnu.py"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'A31' }}

jobs:
  build:
    # Xcode 16 compiles XNU; hash-gated Xcode 15 IIG outputs preserve its ABI.
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Restore compatible DriverKit generator outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$MACHINE_CONFIG" = A31 && test "$MACOS_VERSION" = 13.5 && test "$KERNEL_CONFIG" = DEVELOPMENT
          BASELINE_RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "xnu-iig-baseline" and .expired == false)][0].workflow_run.id // empty')
          BASELINE_NAME=xnu-iig-baseline
          if [ -z "$BASELINE_RUN" ]; then BASELINE_RUN=39977026628; BASELINE_NAME=xnu-buildtree; fi
          gh run download "$BASELINE_RUN" --repo "$GITHUB_REPOSITORY" --name "$BASELINE_NAME" --dir "$RUNNER_TEMP/iig-baseline"
          python3 tools/a31_iig_cache.py prepare "$RUNNER_TEMP/iig-baseline/buildtree.tgz" "$RUNNER_TEMP/iig-cache"
          chmod +x tools/a31_iig_cache.py
          echo "A31_IIG_CACHE=$RUNNER_TEMP/iig-cache" >> "$GITHUB_ENV"
          echo "IIG=$GITHUB_WORKSPACE/tools/a31_iig_cache.py" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: xnu-iig-baseline
          path: ${{ runner.temp }}/iig-baseline/buildtree.tgz
          retention-days: 90

      - name: Check A31 host tools
        if: env.MACHINE_CONFIG == 'A31'
        run: |
          python3 -m unittest discover -s tools -p 'test_a31*.py' -v
          clang -std=gnu11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined shim/a31/xnu_entry_io_test.c -o /tmp/a31-xnu-io-test
          /tmp/a31-xnu-io-test
          clang -std=gnu11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined shim/a31/xnu_final_io_test.c -o /tmp/a31-final-io-test
          /tmp/a31-final-io-test

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists; Xcode is preinstalled.
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(find /Applications -maxdepth 1 -name 'Xcode_16*.app' | sort -V | head -1)
          if [ -z "$XC" ]; then
            echo '::error::No Xcode 16 installation found.'
            exit 1
          fi
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee "$GITHUB_WORKSPACE/xnu-build.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-build-log-${{ env.MACHINE_CONFIG }}
          path: xnu-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify A31 entry-check code was compiled
        if: env.MACHINE_CONFIG == 'A31'
        run: |
          PYTHONPATH=tools python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from a31_payload import validate_kernel
          from a31_reset_check import check_kernel_reset, kernel_function
          config = os.environ['KERNEL_CONFIG'].lower()
          kernel = Path('dxb/fakeroot/System/Library/Kernels') / ('kernel.' + config + '.a31')
          data = kernel.read_bytes()
          result = validate_kernel(data)
          result['reset_code'] = check_kernel_reset(data)
          vectors, _ = kernel_function(data, b'_a31_final_vectors')
          trap, trap_code = kernel_function(data, b'_a31_vm_control_trap')
          assert vectors % 2048 == 0 and trap_code[:4] == bytes.fromhex('204621d4')
          result['vm_code'] = {'vectors_va': hex(vectors), 'trap_va': hex(trap), 'trap_opcode': '0xd4214620'}
          for marker in (b'[A31-XNU] ENTRY MMU-OFF v1', b'[A31-XNU] ENTRY-CHECK PASS',
                         b'[A31-XNU] RECOVERY REQUEST', b'XNU_SCTLR_EL1=',
                         b'[A31-XNU] BOOT EXCEPTION', b'[A31-XNU] STACKS NEXT',
                         b'[A31-XNU] TABLES READY', b'[A31-XNU] MMU ENABLE NEXT',
                         b'[A31-XNU] REBASE-CHECK PASS',
                         b'image rebasing done; before boot args and CPU data',
                         b'[A31-XNU] CPU-DATA-CHECK PASS',
                         b'boot args copied; CPU data initialized; before platform',
                         b'[A31-XNU] PLATFORM-CHECK PASS', b'[A31-XNU] CPU-BOOTSTRAP-CHECK PASS', b'[A31-XNU] CPU-INIT-CHECK PASS', b'[A31-XNU] VM-MAPS-CHECK PASS',
                         b'[A31-XNU] FINAL-IO-ALIASES PASS', b'[A31-XNU] VM-TABLES-CHECK PASS'):
              if marker not in data:
                  raise SystemExit('A31 entry-check code missing from linked kernel')
          result.update(source=os.environ['GITHUB_SHA'], kind='A31 XNU final-VM-table checkpoint only',
                        stops_before='kva_active/pmap bootstrap, drivers and userland',
                        native_execution_verified=False)
          Path('out').mkdir(exist_ok=True)
          Path('out/a31-entry-check.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
